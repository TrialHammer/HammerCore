# HammerCore 1.4.0 for Paper 26.3
# Every runtime switch/tunable is grouped here. Player-facing text lives in messages.yml.
settings:
  version: 5
  enabled: true
  debug: false

info-bar:
  enabled: true
  refresh-ticks: 40
  remove-on-quit: true
  bar-color: WHITE
  bar-style: SOLID
  # Java-edition content. The first matching world entry wins; default is fallback.
  content:
    java:
      default: "#BFCFD4&rꐐ"
      world:
        - "world:#BFCFD4%hammercoreworld_java%&rꐐ%hammercoreseason_java%%hammercoreweather_java%"
        - "vanilla:#BFCFD4%hammercoreworld_java%&rꐐ"
        - "nether:#BFCFD4%hammercoreworld_java%&rꐐ"
        - "the_end:#BFCFD4%hammercoreworld_java%&rꐐ"
    bedrock:
      default: "#BFCFD4%hammercoreworld_bedrock%"
      world:
        - "world:#BFCFD4%hammercoreworld_bedrock%&r %hammercoreseason_bedrock% %hammercoreweather_bedrock%"
        - "vanilla:#BFCFD4%hammercoreworld_bedrock%"
  # Displayed world names.
  world-name:
    java:
      default: ""
      world:
        - "world:ꀦ"
        - "islands:ꀨ"
        - "nether:ꀩ"
        - "the_end:ꀪ"
        - "spawn:ꀧ"
        - "vanilla: "
    bedrock:
      default: "未知世界"
      world:
        - "world:主世界"
        - "islands:浮空岛"
        - "nether:下界"
        - "the_end:末地"
        - "spawn:主城"
        - "vanilla:香草"
  info:
    season:
      default: ""
      season:
        - "春天:\uE114ꀀ"
        - "夏天:\uE114ꀁ"
        - "秋天:\uE114ꀂ"
        - "冬天:\uE114ꀃ"
        - "春:\uE115ꀀ"
        - "夏:\uE115ꀁ"
        - "秋:\uE115ꀂ"
        - "冬:\uE115ꀃ"
    weather:
      default: ""
      weather:
        - "风和日丽:&aꀅ&cꀒ"
        - "轻风:&aꀄ&eꀖ"
        - "阴冷:&7ꀆ&cꀏ"
        - "雨天:&3ꀊ&aꀗ"
        - "灼热:&4ꀉ&6ꀐ"
        - "炎热:&cꀍ&6ꀓ"
        - "温暖:&6ꀎ&cꀓ"
        - "寒冷:&bꀇ &cꀑ"
        - "暴风:&bꀌ&cꀏ"
        - "极寒:&bꀈ&cꀕ"
        - "雪天:&bꀋ&cꀕ"
        - "平静无风:"

action-bar:
  enabled: true
  refresh-ticks: 40
  idle-reset-millis: 1000
  content: "\uE120\uE11E\uE116&f%pkaddons_actionbar% \uE121%rs_temperaturecolor%[ %rs_temperature% ]"

world-protection:
  anti-explosion:
    enabled: true
    only-creepers: true
    worlds: [world, spawn, void]
  anti-griefing:
    enabled: true
    worlds: [world, spawn, void]
  invalid-chat-pattern: "[ꀀ-\uA48F]"
  no-cartographer: true
  prevent-farm-land-destroy: true
  keep-inventory:
    permission: "hammercore.utils.keepinventory"
    minimum-y: -64
    nether-maximum-y: 127
    nether-worlds: [nether, world_nether]
  protect-farm-permission: "hammercore.utils.protectfarm"

floodgate:
  hide-particles: true

util:
  architecture-lore:
    hidden: true
    hide-permission: "hammercore.utils.hidenbt"
    content:
      - "特供建材"
  peeling-recovery:
    enabled: true
    retention-millis: 300000
    cleanup-interval-ticks: 12000
  disable-join-message: true
  disable-quit-message: true
  auto-respawn:
    enabled: true
    delay-ticks: 1
    location:
      world: "spawn"
      x: 309
      y: 62
      z: 632.5
      yaw: 90
      pitch: -3
  disable-elytra: false
  restrict-portal-range:
    enabled: false
    nether-world: "world_nether"
    min-x: -1000
    max-x: 1000
    min-y: -64
    max-y: 320
    min-z: -1000
    max-z: 1000
  quick-actions:
    swap-hand-opens-menu: true
    drop-item-toggles-bending: true
    clock-opens-menu: true
    clock-material: CLOCK
    menu-permission: "group.player"
    menu-command: "dm open main_menu"
    fallback-menu-command: "tutorial 5"
    bend-toggle-command: "bend toggle"
  spawn-litter:
    enabled: true
    world: "world"
    min-x: 56
    min-y: 22
    min-z: 120
    max-x: 103
    max-y: 82
    max-z: 217
    cooldown-millis: 120000
    cleanup-delay-ticks: 1200
    cleanup-seconds: 120
  souvenir:
    enabled: true
    map-material: FILLED_MAP
    general-lore-pattern: "<[0-9]{4}-[0-9]{2}>"
    ender-eye-enabled: true
    workbench-lore-pattern: "\\[[0-9]{4}-[0-9]{2}]"
    architecture-lore-pattern: ".*特供建材.*"
    teleport-lore-pattern: "\\[[0-9]{3}-.*]"
    warp-command: "huskhomes:warp %warp% %player%"

join:
  remove-effects-longer-than-ticks: 6000
snowball:
  enabled: true
  velocity-multiplier: 2.0
  damage: 3.0

item-frame-lock:
  enabled: true


projectkorra:
  all-earth-binder: false
  add-earth-delay-ticks: 20
  add-earth-command: "bend add earth %player%"

minecart:
  enabled: true
  remove-on-leave: true
  accelerator:
    enabled: true
    rails-required: 5
    boosted-max-speed: 2.4
    normal-max-speed: 0.4
    speed-cap: 2.0

brewery:
  quality-names:
    premium-meng-po: "优质孟婆汤"
    wine: "红酒"
  commands:
    meng-po-bend-remove: "bend remove %player%"
    meng-po-warp: "warp 元素祭坛 %player%"
    wine-reward: "si give 23中秋巡礼-风滚草镇 1 %player%"
  wine-lore-pattern: ".*XL木桶熟成.*"

integrations:
  brewery:
    enabled: true
  projectkorra:
    enabled: true
  seasons:
    enabled: true
    world: "world"

admin:
  magic-stick:
    cooldown-millis: 120000
    uses: 10
  target-threshold: 1.0
  target-range: 50.0
  random-effect-duration-ticks: 100
  random-effect-amplifier: 1
  levitation-duration-ticks: 60
  levitation-amplifier: 1
  sonic-boom:
    velocity: 2.0
    particle-count: 3
    sound-volume: 1.0
    sound-pitch: 1.0
    interval-ticks: 5
    steps: 4

