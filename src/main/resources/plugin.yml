name: HammerCore
version: '${project.version}-${paper.version}'
main: ink.ziip.hammer.hammercore.HammerCore
api-version: '${paper.api-version}'
authors: [ EterLzb ]
description: Core plugin of TrialHammer.
depend:
  - ProtocolLib
  - PlaceholderAPI
  - floodgate
softdepend:
  - ProjectKorra
  - BreweryX
  - CoreProtect
  - RealisticSeasons
  - CauldronInteract
  - ElementTemperature
commands:
  hammercore:
    description: Core command.
    usage: /<command>
  menu:
    description: Opening menu command.
    usage: /<command>
  cauldroninteract:
    description: Shows cauldron automation status or reloads HammerCore configuration.
    usage: /<command> <status|reload>
    permission: cauldroninteract.admin
    aliases: [ci]
  elementtemp:
    description: Shows element temperature status or reloads HammerCore configuration.
    usage: /<command> <status|reload>
    permission: elementtemperature.admin
permissions:
  hammercore.admin:
    description: Grants all HammerCore administrative commands.
    default: op
    children:
      hammercore.admin.talk: true
      hammercore.admin.give-random-effect: true
      hammercore.admin.give-levitation-effect: true
      hammercore.admin.remove-main-hand: true
      hammercore.admin.sonic-boom: true
      hammercore.reload: true
      hammercore.status: true
      hammercore.ride: true
      hammercore.say: true
      hammercore.toggle: true
      cauldroninteract.admin: true
      elementtemperature.admin: true
  hammercore.restorevillagers:
    description: Restores optimised villagers to their original state.
    default: true
  hammercore.antiraidfarm.bypass:
    description: Bypass the anti raid farm cooldown.
    default: op
  cauldroninteract.admin:
    description: Shows cauldron automation status and reloads its settings.
    default: op
  elementtemperature.admin:
    description: Shows element temperature status and reloads its settings.
    default: op
  elementtemperature.exempt:
    description: Exempts the player from HammerCore's element temperature correction.
    default: false
